<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waypoint v0.0.1</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --purple: #8957e5;
      --purple-hover: #9e6ff5;
      --blue: #238636;
      --blue-hover: #2ea043;
      --accent-blue: #388bfd;
      --btn-gray: #21262d;
      --btn-gray-hover: #30363d;
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 24px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    h1 {
      color: var(--text-bright);
      font-size: 1.6rem;
      font-weight: 700;
    }

    .version-tag {
      font-size: 0.8rem;
      background-color: var(--btn-gray);
      color: var(--purple-hover);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-weight: 600;
    }

    .user-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-field {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-blue);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .sync-link {
      color: var(--accent-blue);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
      padding: 0;
    }

    .sync-link:hover {
      color: #58a6ff;
    }

    .quota-pill {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .search-row {
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    .repo-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .repo-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .repo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .repo-name-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .repo-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .repo-link:hover {
      text-decoration: underline;
    }

    .branch-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
      background-color: var(--btn-gray);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .action-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--btn-gray);
      color: var(--text-bright);
      transition: background-color 0.15s;
    }

    .btn:hover {
      background-color: var(--btn-gray-hover);
    }

    .btn-purple {
      background-color: var(--purple);
      border-color: var(--purple);
      color: white;
    }

    .btn-purple:hover {
      background-color: var(--purple-hover);
    }

    .btn-blue {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: white;
    }

    .btn-blue:hover {
      background-color: #58a6ff;
    }

    .files-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 0;
    }

    .files-toggle-btn:hover {
      color: var(--text-bright);
    }

    .files-drawer {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .files-drawer.open {
      display: block;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-family: monospace;
      gap: 10px;
    }

    .file-item:hover {
      background-color: var(--btn-gray);
    }

    .file-path {
      word-break: break-all;
      color: var(--text);
    }

    .file-download-link {
      color: var(--accent-blue);
      text-decoration: none;
      white-space: nowrap;
      font-size: 0.75rem;
      padding: 2px 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .file-download-link:hover {
      background-color: var(--btn-gray-hover);
    }

    .empty-state, .error-banner {
      padding: 30px;
      text-align: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .error-banner {
      color: var(--danger);
      border-color: var(--danger);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-top">
      <div class="title-group">
        <h1>Waypoint</h1>
        <span class="version-tag">v0.0.1</span>
      </div>

      <form class="user-form" id="user-form" onsubmit="handleUserSubmit(event)">
        <input type="text" class="input-field" id="user-input" placeholder="GitHub username" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn btn-purple">Switch</button>
      </form>
    </div>

    <div class="status-bar">
      <div>
        Active account: <strong id="current-user-display" style="color: var(--text-bright);">spamfan</strong>
        <span style="margin: 0 6px;">•</span>
        <span id="last-sync-text">Checking data...</span>
        <button class="sync-link" id="check-again-btn" onclick="syncNow()">[Check again now]</button>
      </div>
      <div class="quota-pill" id="quota-display">Quota: --/60</div>
    </div>
  </header>

  <div id="error-box" class="error-banner" style="display: none;"></div>

  <div class="search-row">
    <input type="text" id="filter-input" class="search-input" placeholder="Filter repositories..." oninput="handleFilter(this.value)">
  </div>

  <div id="repo-list" class="repo-grid">
    <div class="empty-state">Loading repositories...</div>
  </div>
</div>

<script>
  const DEFAULT_USER = 'spamfan';
  let currentUser = DEFAULT_USER;
  let reposData = [];
  let lastSyncTimestamp = 0;
  let relativeTimeTimer = null;

  function formatRelativeTime(ts) {
    if (!ts) return 'Never checked';
    const elapsedSeconds = Math.floor((Date.now() - ts) / 1000);
    if (elapsedSeconds < 10) return 'Checked just now';
    if (elapsedSeconds < 60) return `Checked ${elapsedSeconds}s ago`;
    const elapsedMinutes = Math.floor(elapsedSeconds / 60);
    if (elapsedMinutes < 60) return `Checked ${elapsedMinutes}m ago`;
    const elapsedHours = Math.floor(elapsedMinutes / 60);
    if (elapsedHours < 24) return `Checked ${elapsedHours}h ago`;
    return `Checked ${Math.floor(elapsedHours / 24)}d ago`;
  }

  function updateStatusUI() {
    document.getElementById('current-user-display').innerText = currentUser;
    document.getElementById('last-sync-text').innerText = formatRelativeTime(lastSyncTimestamp);
  }

  function getStorageKey(user) {
    return `wp_data_${user.toLowerCase()}`;
  }

  async function loadInitialData() {
    const params = new URLSearchParams(window.location.search);
    const requestedUser = params.get('u') || params.get('user');
    currentUser = requestedUser ? requestedUser.trim() : DEFAULT_USER;
    document.getElementById('user-input').value = currentUser;

    const cachedStr = localStorage.getItem(getStorageKey(currentUser));
    if (cachedStr) {
      try {
        const parsed = JSON.parse(cachedStr);
        reposData = parsed.repos || [];
        lastSyncTimestamp = parsed.synced_at || 0;
        updateStatusUI();
        renderRepos();
        return;
      } catch (e) {
        localStorage.removeItem(getStorageKey(currentUser));
      }
    }

    if (currentUser.toLowerCase() === DEFAULT_USER.toLowerCase()) {
      try {
        const res = await fetch('repos.json');
        if (res.ok) {
          const fileData = await res.json();
          reposData = fileData.repos || [];
          lastSyncTimestamp = fileData.synced_at || Date.now();
          saveToCache();
          updateStatusUI();
          renderRepos();
          return;
        }
      } catch (e) {
        // Fallback to live API fetch
      }
    }

    await syncNow();
  }

  function saveToCache() {
    const payload = {
      user: currentUser,
      synced_at: lastSyncTimestamp,
      repos: reposData
    };
    localStorage.setItem(getStorageKey(currentUser), JSON.stringify(payload));
  }

  async function syncNow() {
    const syncBtn = document.getElementById('check-again-btn');
    const errorBox = document.getElementById('error-box');
    errorBox.style.display = 'none';
    syncBtn.innerText = '[Checking...]';
    syncBtn.disabled = true;

    try {
      const res = await fetch(`https://api.github.com/users/${currentUser}/repos?per_page=100&sort=updated`);
      
      const quotaRemaining = res.headers.get('x-ratelimit-remaining');
      const quotaLimit = res.headers.get('x-ratelimit-limit');
      if (quotaRemaining !== null && quotaLimit !== null) {
        document.getElementById('quota-display').innerText = `Quota: ${quotaRemaining}/${quotaLimit}`;
      }

      if (!res.ok) {
        if (res.status === 403) {
          throw new Error('API rate limit reached (60/hr limit). Please wait for reset or try again later.');
        }
        throw new Error(`GitHub API error: ${res.status} ${res.statusText}`);
      }

      const rawRepos = await res.json();
      const newRepos = [];

      for (const r of rawRepos) {
        if (r.fork) continue;
        const branch = r.default_branch || 'main';
        newRepos.push({
          name: r.name,
          branch: branch,
          repo_url: r.html_url,
          upload_url: `https://github.com/${currentUser}/${r.name}/upload/${branch}`,
          zip_url: `https://github.com/${currentUser}/${r.name}/archive/refs/heads/${branch}.zip`,
          files: []
        });
      }

      reposData = newRepos;
      lastSyncTimestamp = Date.now();
      saveToCache();
      updateStatusUI();
      renderRepos();
    } catch (err) {
      errorBox.innerText = err.message;
      errorBox.style.display = 'block';
    } finally {
      syncBtn.innerText = '[Check again now]';
      syncBtn.disabled = false;
    }
  }

  async function loadRepoFiles(repoName, branch) {
    const drawer = document.getElementById(`drawer-${repoName}`);
    const toggleBtn = document.getElementById(`toggle-btn-${repoName}`);

    if (drawer.classList.contains('open')) {
      drawer.classList.remove('open');
      toggleBtn.innerText = 'Explore files ▼';
      return;
    }

    drawer.classList.add('open');
    toggleBtn.innerText = 'Hide files ▲';

    const repoObj = reposData.find(r => r.name === repoName);
    if (repoObj && repoObj.files && repoObj.files.length > 0) {
      renderFilesDrawer(repoName, repoObj.files);
      return;
    }

    drawer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 6px;">Loading files...</div>';

    try {
      const res = await fetch(`https://api.github.com/repos/${currentUser}/${repoName}/git/trees/${branch}?recursive=1`);
      
      const quotaRemaining = res.headers.get('x-ratelimit-remaining');
      const quotaLimit = res.headers.get('x-ratelimit-limit');
      if (quotaRemaining !== null && quotaLimit !== null) {
        document.getElementById('quota-display').innerText = `Quota: ${quotaRemaining}/${quotaLimit}`;
      }

      if (!res.ok) throw new Error(`Could not fetch files (${res.status})`);

      const treeData = await res.json();
      const files = (treeData.tree || [])
        .filter(item => item.type === 'blob')
        .map(item => ({
          path: item.path,
          raw_url: `https://raw.githubusercontent.com/${currentUser}/${repoName}/${branch}/${item.path}`
        }));

      if (repoObj) {
        repoObj.files = files;
        saveToCache();
      }
      renderFilesDrawer(repoName, files);
    } catch (err) {
      drawer.innerHTML = `<div style="color: var(--danger); font-size: 0.8rem; padding: 6px;">Error: ${err.message}</div>`;
    }
  }

  function renderFilesDrawer(repoName, files) {
    const drawer = document.getElementById(`drawer-${repoName}`);
    if (!files || files.length === 0) {
      drawer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 6px;">No files found in branch.</div>';
      return;
    }

    let html = '';
    files.forEach(f => {
      html += `
        <div class="file-item">
          <span class="file-path">${f.path}</span>
          <a href="${f.raw_url}" target="_blank" download class="file-download-link">Download</a>
        </div>
      `;
    });
    drawer.innerHTML = html;
  }

  function handleFilter(term) {
    renderRepos(term.toLowerCase().trim());
  }

  function handleUserSubmit(e) {
    e.preventDefault();
    const inputVal = document.getElementById('user-input').value.trim();
    if (inputVal && inputVal.toLowerCase() !== currentUser.toLowerCase()) {
      currentUser = inputVal;
      reposData = [];
      lastSyncTimestamp = 0;
      updateStatusUI();
      syncNow();
    }
  }

  function renderRepos(filterTerm = '') {
    const container = document.getElementById('repo-list');
    const filtered = reposData.filter(r => r.name.toLowerCase().includes(filterTerm));

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">No repositories match your criteria.</div>';
      return;
    }

    let html = '';
    filtered.forEach(repo => {
      const hasIndexHtml = repo.files && repo.files.some(f => f.path.toLowerCase() === 'index.html');
      const directIndexUrl = `https://raw.githubusercontent.com/${currentUser}/${repo.name}/${repo.branch}/index.html`;

      html += `
        <div class="repo-card">
          <div class="repo-header">
            <div class="repo-name-box">
              <a href="${repo.repo_url}" target="_blank" class="repo-link">${repo.name}</a>
              <span class="branch-badge">${repo.branch}</span>
            </div>
            <div class="action-group">
              <a href="${repo.repo_url}" target="_blank" class="btn">Repo</a>
              <a href="${repo.upload_url}" target="_blank" class="btn btn-purple">Upload</a>
              <a href="${directIndexUrl}" target="_blank" download class="btn btn-blue">Download index.html</a>
              <a href="${repo.zip_url}" target="_blank" class="btn">ZIP</a>
            </div>
          </div>
          <button id="toggle-btn-${repo.name}" class="files-toggle-btn" onclick="loadRepoFiles('${repo.name}', '${repo.branch}')">
            Explore files ▼
          </button>
          <div id="drawer-${repo.name}" class="files-drawer"></div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  // Periodic relative time ticker
  relativeTimeTimer = setInterval(updateStatusUI, 30000);

  // Initialize
  loadInitialData();
</script>
</body>
</html>
