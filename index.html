<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigator v0.2.2</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --purple: #8957e5;
      --purple-hover: #9e6ff5;
      --blue: #238636;
      --blue-hover: #2ea043;
      --accent-blue: #388bfd;
      --btn-gray: #21262d;
      --btn-gray-hover: #30363d;
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 24px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }

    .title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    h1 {
      color: var(--text-bright);
      font-size: 1.6rem;
      font-weight: 700;
    }

    .version-tag {
      font-size: 0.8rem;
      background-color: var(--btn-gray);
      color: var(--purple-hover);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-weight: 600;
    }

    .header-nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 4px 6px;
      color: #58a6ff;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
    }

    .header-nav-link:hover {
      text-decoration: underline;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-main {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sync-btn {
      background: var(--btn-gray);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .sync-btn:hover {
      background-color: var(--btn-gray-hover);
      color: var(--text-bright);
    }

    .sync-btn.spinning svg {
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .user-pill-btn {
      background: var(--btn-gray);
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s;
    }

    .user-pill-btn:hover {
      border-color: var(--accent-blue);
    }

    .user-pill-btn .edit-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .inline-user-input {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-blue);
      color: var(--text-bright);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
      width: 105px;
    }

    .quota-pill {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus, .sort-select:focus {
      border-color: var(--accent-blue);
    }

    .sort-select {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .repo-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .repo-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .repo-card.is-dragging {
      opacity: 0.4;
      outline: 2px dashed var(--accent-blue);
    }

    .repo-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .repo-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .repo-id-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .repo-tools {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .repo-quick-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .repo-text-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 2px 4px;
    }

    .repo-text-link:hover {
      color: var(--accent-blue);
      text-decoration: underline;
    }

    .drag-handle {
      cursor: grab;
      user-select: none;
      touch-action: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 0 4px;
      line-height: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .btn-sm {
      padding: 3px 8px;
      font-size: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--btn-gray);
      color: var(--text-bright);
      transition: background-color 0.15s;
    }

    .btn:hover {
      background-color: var(--btn-gray-hover);
    }

    .btn-purple {
      background-color: var(--purple);
      border-color: var(--purple);
      color: white;
    }

    .btn-purple:hover {
      background-color: var(--purple-hover);
    }

    .btn-blue {
      background-color: var(--accent-blue);
      border-color: var(--accent-blue);
      color: white;
    }

    .btn-blue:hover {
      background-color: #58a6ff;
    }

    .files-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 0;
      padding: 0;
    }

    .files-toggle-btn:hover {
      color: var(--text-bright);
    }

    .files-drawer {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .files-drawer.open {
      display: block;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-family: monospace;
      gap: 10px;
    }

    .file-item:hover {
      background-color: var(--btn-gray);
    }

    .file-path {
      word-break: break-all;
      color: var(--text);
    }

    .file-download-link {
      color: var(--accent-blue);
      text-decoration: none;
      white-space: nowrap;
      font-size: 0.75rem;
      padding: 2px 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .file-download-link:hover {
      background-color: var(--btn-gray-hover);
    }

    .empty-state, .error-banner {
      padding: 30px;
      text-align: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .error-banner {
      color: var(--danger);
      border-color: var(--danger);
      margin-bottom: 20px;
    }

    .warning-banner {
      padding: 12px 16px;
      margin-bottom: 16px;
      background-color: rgba(210, 153, 34, 0.12);
      border: 1px solid #d29922;
      color: #e3b341;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .btn-green {
      background-color: #238636;
      border-color: #2ea043;
      color: white;
    }

    .btn-green:hover {
      background-color: #2ea043;
    }

    .btn-primary-goto {
      font-weight: 700;
      font-size: 0.9rem;
      padding: 6px 12px;
    }

    .tool-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .tool-btn:hover {
      background-color: var(--btn-gray-hover);
      color: var(--text-bright);
    }

    .tool-btn.star-active {
      color: #e3b341;
      border-color: #e3b341;
    }

    .file-path {
      word-break: break-all;
      color: var(--text);
      text-decoration: none;
    }

    .file-path:hover {
      color: var(--accent-blue);
      text-decoration: underline;
    }

    .hidden-banner {
      margin-top: 14px;
      padding: 10px 14px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hidden-banner button {
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
      padding: 0;
    }

    .hidden-banner button:hover {
      color: #58a6ff;
    }

    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      pointer-events: none;
      width: calc(100% - 32px);
      max-width: 420px;
    }

    .toast {
      pointer-events: auto;
      background-color: #1f242c;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, opacity 0.2s ease;
      touch-action: pan-y;
    }

    .toast.swiping {
      transition: none;
    }

    .toast.fade-out {
      opacity: 0;
      transform: translateY(10px);
    }

    .toast-content {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toast-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .toast-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .toast-undo {
      color: var(--accent-blue);
    }

    .toast-undo:hover {
      text-decoration: underline;
    }

    .toast-close {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1;
    }

    .toast-close:hover {
      color: var(--text-bright);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-top">
      <div class="title-group">
        <h1>Navigator</h1>
        <span class="version-tag">v0.2.2</span>
      </div>

      <div class="header-nav-links">
        <a href="https://spamfan.github.io/patcher/" id="link-patcher" class="header-nav-link" target="_self">patcher</a>
        <a href="https://spamfan.github.io/mdviewer/" id="link-mdviewer" class="header-nav-link" target="_self">mdviewer</a>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-main">
        <button class="sync-btn" id="check-again-btn" onclick="syncNow()" title="Check again now" aria-label="Check again now">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .655-.835zm12.59-1.01a.75.75 0 0 1-.834-.656 5.5 5.5 0 0 0-9.592-2.97l1.204 1.204a.25.25 0 0 1-.177.427H1.25a.25.25 0 0 1-.25-.25V1.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-.655.835z"/>
          </svg>
        </button>
        <span>Checked</span>
        <span id="user-badge-container">
          <button class="user-pill-btn" id="user-pill-btn" onclick="enableInlineUserEdit()" title="Switch GitHub account">
            <span id="current-user-display">spamfan</span>
            <svg class="edit-icon" width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
              <path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25a1.75 1.75 0 0 1 .445-.758l8.61-8.61zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086zM10.104 4.457 2.978 11.583c-.07.07-.123.156-.153.252l-.588 2.057 2.057-.588c.096-.03.182-.083.252-.153l7.126-7.126-1.568-1.568z"/>
            </svg>
          </button>
        </span>
        <span>repos</span>
        <span id="last-sync-text">just now.</span>
      </div>
      <div class="quota-pill" id="quota-display">Quota: --/60</div>
    </div>
  </header>

  <div id="error-box" class="error-banner" style="display: none;"></div>
  <div id="warning-box" class="warning-banner" style="display: none;"></div>

  <div class="search-row">
    <input type="text" id="filter-input" class="search-input" placeholder="Filter repositories..." oninput="handleFilter(this.value)">
    <select id="sort-select" class="sort-select" onchange="handleSortChange(this.value)">
      <option value="action">Latest repo action</option>
      <option value="visited">Recently visited</option>
      <option value="alpha">Name (A–Z)</option>
    </select>
  </div>

  <div id="repo-list" class="repo-grid">
    <div class="empty-state">Loading repositories...</div>
  </div>

  <div id="hidden-bar" class="hidden-banner" style="display: none;"></div>
  <div id="toast-container" class="toast-container"></div>
</div>

<script>
  const DEFAULT_USER = 'spamfan';
  let currentUser = DEFAULT_USER;
  let reposData = [];
  let lastSyncTimestamp = 0;
  let currentFilter = '';
  let relativeTimeTimer = null;

  function formatRelativeTime(ts) {
    if (!ts) return 'never.';
    const elapsedSeconds = Math.floor((Date.now() - ts) / 1000);
    if (elapsedSeconds < 10) return 'just now.';
    if (elapsedSeconds < 60) return `${elapsedSeconds}s ago.`;
    const elapsedMinutes = Math.floor(elapsedSeconds / 60);
    if (elapsedMinutes < 60) return `${elapsedMinutes}m ago.`;
    const elapsedHours = Math.floor(elapsedMinutes / 60);
    const remMinutes = elapsedMinutes % 60;
    if (elapsedHours < 24) {
      return remMinutes > 0 ? `${elapsedHours}h ${remMinutes}m ago.` : `${elapsedHours}h ago.`;
    }
    return `${Math.floor(elapsedHours / 24)}d ago.`;
  }

  function updateStatusUI() {
    const userDisplay = document.getElementById('current-user-display');
    if (userDisplay) userDisplay.innerText = currentUser;
    const syncText = document.getElementById('last-sync-text');
    if (syncText) syncText.innerText = formatRelativeTime(lastSyncTimestamp);
    const patcherLink = document.getElementById('link-patcher');
    if (patcherLink) patcherLink.href = `https://${currentUser}.github.io/patcher/`;
    const mdviewerLink = document.getElementById('link-mdviewer');
    if (mdviewerLink) mdviewerLink.href = `https://${currentUser}.github.io/mdviewer/`;
  }

  function enableInlineUserEdit() {
    const container = document.getElementById('user-badge-container');
    if (!container) return;
    container.innerHTML = `<input type="text" class="inline-user-input" id="inline-user-input" value="${currentUser}" autocomplete="off" spellcheck="false">`;
    const input = document.getElementById('inline-user-input');
    input.focus();
    input.select();

    let committed = false;
    const finish = (apply) => {
      if (committed) return;
      committed = true;
      if (apply) {
        commitUserSwitch(input.value.trim());
      } else {
        renderUserBadge();
      }
    };

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        finish(true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        finish(false);
      }
    });

    input.addEventListener('blur', () => {
      finish(true);
    });
  }

  function renderUserBadge() {
    const container = document.getElementById('user-badge-container');
    if (!container) return;
    container.innerHTML = `
      <button class="user-pill-btn" id="user-pill-btn" onclick="enableInlineUserEdit()" title="Switch GitHub account">
        <span id="current-user-display">${currentUser}</span>
        <svg class="edit-icon" width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
          <path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25a1.75 1.75 0 0 1 .445-.758l8.61-8.61zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086zM10.104 4.457 2.978 11.583c-.07.07-.123.156-.153.252l-.588 2.057 2.057-.588c.096-.03.182-.083.252-.153l7.126-7.126-1.568-1.568z"/>
        </svg>
      </button>
    `;
  }

  function commitUserSwitch(inputVal) {
    if (inputVal && inputVal.toLowerCase() !== currentUser.toLowerCase()) {
      currentUser = inputVal;
      reposData = [];
      lastSyncTimestamp = 0;
      renderUserBadge();
      updateStatusUI();
      syncNow();
    } else {
      renderUserBadge();
    }
  }

  function saveQuota(remaining, limit, resetEpoch) {
    const payload = { remaining, limit, reset: resetEpoch };
    localStorage.setItem('wp_quota', JSON.stringify(payload));
    updateQuotaUI(remaining, limit);
  }

  function updateQuotaUI(remaining, limit) {
    if (remaining !== null && limit !== null) {
      document.getElementById('quota-display').innerText = `Quota: ${remaining}/${limit}`;
    }
  }

  function loadCachedQuota() {
    const raw = localStorage.getItem('wp_quota');
    if (!raw) return;
    try {
      const q = JSON.parse(raw);
      if (q && q.remaining !== undefined && q.limit !== undefined) {
        updateQuotaUI(q.remaining, q.limit);
      }
    } catch (e) {}
  }

  function getStorageKey(user) {
    return `wp_data_${user.toLowerCase()}`;
  }

  function getPrefs() {
    const key = `wp_prefs_${currentUser.toLowerCase()}`;
    const raw = localStorage.getItem(key);
    if (!raw) return { favorites: [], hidden: [], sort: 'action' };
    try {
      const parsed = JSON.parse(raw);
      return {
        favorites: Array.isArray(parsed.favorites) ? parsed.favorites : [],
        hidden: Array.isArray(parsed.hidden) ? parsed.hidden : [],
        sort: parsed.sort || 'action'
      };
    } catch (e) {
      return { favorites: [], hidden: [], sort: 'action' };
    }
  }

  function savePrefs(prefs) {
    localStorage.setItem(`wp_prefs_${currentUser.toLowerCase()}`, JSON.stringify(prefs));
  }

  function toggleFavorite(repoName) {
    const prefs = getPrefs();
    const idx = prefs.favorites.indexOf(repoName);
    if (idx > -1) {
      prefs.favorites.splice(idx, 1);
    } else {
      prefs.favorites.push(repoName);
    }
    savePrefs(prefs);
    renderRepos();
  }

  let toastTimer = null;

  function dismissToast() {
    if (toastTimer) {
      clearTimeout(toastTimer);
      toastTimer = null;
    }
    const toast = document.getElementById('active-toast');
    if (toast) {
      toast.classList.add('fade-out');
      setTimeout(() => {
        const container = document.getElementById('toast-container');
        if (container) container.innerHTML = '';
      }, 200);
    }
  }

  function undoHide(repoName) {
    const prefs = getPrefs();
    const idx = prefs.hidden.indexOf(repoName);
    if (idx > -1) {
      prefs.hidden.splice(idx, 1);
      savePrefs(prefs);
      renderRepos();
    }
    dismissToast();
  }

  function showToast(repoName) {
    if (toastTimer) clearTimeout(toastTimer);
    const container = document.getElementById('toast-container');
    if (!container) return;

    container.innerHTML = `
      <div class="toast" id="active-toast">
        <div class="toast-content">
          <span>Hid <strong>${repoName}</strong></span>
        </div>
        <div class="toast-actions">
          <button class="toast-btn toast-undo" onclick="undoHide('${repoName}')">Undo</button>
          <button class="toast-btn toast-close" onclick="dismissToast()" title="Dismiss">✕</button>
        </div>
      </div>
    `;

    const toast = document.getElementById('active-toast');
    initToastSwipe(toast);
    toastTimer = setTimeout(dismissToast, 5000);
  }

  function initToastSwipe(toast) {
    let startX = 0;
    let currentDelta = 0;
    let isTouching = false;

    const onStart = (e) => {
      if (e.target.closest('button')) return;
      isTouching = true;
      startX = e.clientX;
      currentDelta = 0;
      toast.classList.add('swiping');
    };

    const onMove = (e) => {
      if (!isTouching) return;
      currentDelta = e.clientX - startX;
      toast.style.transform = `translateX(${currentDelta}px)`;
      toast.style.opacity = `${Math.max(0.1, 1 - Math.abs(currentDelta) / 180)}`;
    };

    const onEnd = () => {
      if (!isTouching) return;
      isTouching = false;
      toast.classList.remove('swiping');
      if (Math.abs(currentDelta) > 60) {
        const exitX = currentDelta > 0 ? 300 : -300;
        toast.style.transform = `translateX(${exitX}px)`;
        toast.style.opacity = '0';
        setTimeout(dismissToast, 180);
      } else {
        toast.style.transform = '';
        toast.style.opacity = '';
      }
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onEnd);
      window.removeEventListener('pointercancel', onEnd);
    };

    toast.addEventListener('pointerdown', (e) => {
      onStart(e);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onEnd);
      window.addEventListener('pointercancel', onEnd);
    });
  }

  function toggleHide(repoName) {
    const prefs = getPrefs();
    const idx = prefs.hidden.indexOf(repoName);
    if (idx > -1) {
      prefs.hidden.splice(idx, 1);
    } else {
      prefs.hidden.push(repoName);
      showToast(repoName);
    }
    savePrefs(prefs);
    renderRepos();
  }

  function unhideAll() {
    const prefs = getPrefs();
    prefs.hidden = [];
    savePrefs(prefs);
    renderRepos();
  }

  function recordVisit(repoName) {
    const key = `wp_visits_${currentUser.toLowerCase()}`;
    let visits = {};
    try {
      visits = JSON.parse(localStorage.getItem(key) || '{}');
    } catch (e) {}
    visits[repoName] = Date.now();
    localStorage.setItem(key, JSON.stringify(visits));
  }

  function getVisits() {
    const key = `wp_visits_${currentUser.toLowerCase()}`;
    try {
      return JSON.parse(localStorage.getItem(key) || '{}');
    } catch (e) {
      return {};
    }
  }

  function handleSortChange(sortVal) {
    const prefs = getPrefs();
    prefs.sort = sortVal;
    savePrefs(prefs);
    renderRepos();
  }

  function checkStaleSnapshot(syncedAt) {
    const warnBox = document.getElementById('warning-box');
    if (!warnBox) return;
    if (!syncedAt) {
      warnBox.style.display = 'none';
      return;
    }
    const STALE_THRESHOLD = 18 * 60 * 60 * 1000;
    const isStale = (Date.now() - syncedAt) > STALE_THRESHOLD;
    if (isStale) {
      warnBox.innerText = 'Workflow warning: Snapshot data is over 18 hours stale. The GitHub Actions crawler may have failed or paused.';
      warnBox.style.display = 'block';
    } else {
      warnBox.style.display = 'none';
    }
  }

  async function loadInitialData() {
    const params = new URLSearchParams(window.location.search);
    const requestedUser = params.get('u') || params.get('user');
    currentUser = requestedUser ? requestedUser.trim() : DEFAULT_USER;

    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const filterInput = document.getElementById('filter-input');
      if (filterInput) filterInput.focus();
    }

    let hasValidCache = false;
    const cachedStr = localStorage.getItem(getStorageKey(currentUser));
    if (cachedStr) {
      try {
        const parsed = JSON.parse(cachedStr);
        reposData = parsed.repos || [];
        lastSyncTimestamp = parsed.synced_at || 0;
        checkStaleSnapshot(lastSyncTimestamp);
        updateStatusUI();
        renderRepos();
        hasValidCache = true;
      } catch (e) {
        localStorage.removeItem(getStorageKey(currentUser));
      }
    }

    const isDefaultUser = currentUser.toLowerCase() === DEFAULT_USER.toLowerCase();
    const SIX_HOURS = 6 * 60 * 60 * 1000;
    const cacheIsOld = (Date.now() - lastSyncTimestamp) > SIX_HOURS;

    if (isDefaultUser && (!hasValidCache || cacheIsOld)) {
      try {
        const res = await fetch('repos.json');
        if (res.ok) {
          const fileData = await res.json();
          if (!hasValidCache || (fileData.synced_at && fileData.synced_at > lastSyncTimestamp)) {
            reposData = fileData.repos || [];
            lastSyncTimestamp = fileData.synced_at || Date.now();
            checkStaleSnapshot(lastSyncTimestamp);
            saveToCache();
            updateStatusUI();
            renderRepos();
            return;
          }
        }
      } catch (e) {
        // Fallback continues below
      }
    }

    if (!hasValidCache) {
      await syncNow();
    }
  }

  function saveToCache() {
    const payload = {
      user: currentUser,
      synced_at: lastSyncTimestamp,
      repos: reposData
    };
    localStorage.setItem(getStorageKey(currentUser), JSON.stringify(payload));
  }

  async function syncNow() {
    const syncBtn = document.getElementById('check-again-btn');
    const errorBox = document.getElementById('error-box');
    const warnBox = document.getElementById('warning-box');
    errorBox.style.display = 'none';
    if (warnBox) warnBox.style.display = 'none';
    syncBtn.classList.add('spinning');
    syncBtn.disabled = true;

    try {
      const res = await fetch(`https://api.github.com/users/${currentUser}/repos?per_page=100&sort=updated`);
      
      const quotaRemaining = res.headers.get('x-ratelimit-remaining');
      const quotaLimit = res.headers.get('x-ratelimit-limit');
      const quotaReset = res.headers.get('x-ratelimit-reset');
      if (quotaRemaining !== null && quotaLimit !== null) {
        saveQuota(quotaRemaining, quotaLimit, quotaReset);
      }

      if (!res.ok) {
        if (res.status === 403) {
          throw new Error('API rate limit reached (60/hr limit). Please wait for reset or try again later.');
        }
        throw new Error(`GitHub API error: ${res.status} ${res.statusText}`);
      }

      const rawRepos = await res.json();
      const newRepos = [];

      for (const r of rawRepos) {
        if (r.fork) continue;
        const branch = r.default_branch || 'main';
        newRepos.push({
          name: r.name,
          branch: branch,
          repo_url: r.html_url,
          upload_url: `https://github.com/${currentUser}/${r.name}/upload/${branch}`,
          zip_url: `https://github.com/${currentUser}/${r.name}/archive/refs/heads/${branch}.zip`,
          files: []
        });
      }

      reposData = newRepos;
      lastSyncTimestamp = Date.now();
      saveToCache();
      updateStatusUI();
      renderRepos();
    } catch (err) {
      errorBox.innerText = err.message;
      errorBox.style.display = 'block';
    } finally {
      syncBtn.classList.remove('spinning');
      syncBtn.disabled = false;
    }
  }

  async function loadRepoFiles(repoName, branch) {
    const drawer = document.getElementById(`drawer-${repoName}`);
    const toggleBtn = document.getElementById(`toggle-btn-${repoName}`);

    if (drawer.classList.contains('open')) {
      drawer.classList.remove('open');
      toggleBtn.innerText = 'Files ▼';
      return;
    }

    drawer.classList.add('open');
    toggleBtn.innerText = 'Files ▲';

    const repoObj = reposData.find(r => r.name === repoName);
    if (repoObj && repoObj.files && repoObj.files.length > 0) {
      renderFilesDrawer(repoName, branch, repoObj.files);
      return;
    }

    drawer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 6px;">Loading files...</div>';

    try {
      const res = await fetch(`https://api.github.com/repos/${currentUser}/${repoName}/git/trees/${branch}?recursive=1`);
      
      const quotaRemaining = res.headers.get('x-ratelimit-remaining');
      const quotaLimit = res.headers.get('x-ratelimit-limit');
      const quotaReset = res.headers.get('x-ratelimit-reset');
      if (quotaRemaining !== null && quotaLimit !== null) {
        saveQuota(quotaRemaining, quotaLimit, quotaReset);
      }

      if (!res.ok) throw new Error(`Could not fetch files (${res.status})`);

      const treeData = await res.json();
      const files = (treeData.tree || [])
        .filter(item => item.type === 'blob')
        .map(item => ({
          path: item.path,
          raw_url: `https://raw.githubusercontent.com/${currentUser}/${repoName}/${branch}/${item.path}`
        }));

      if (repoObj) {
        repoObj.files = files;
        saveToCache();
      }
      renderFilesDrawer(repoName, branch, files);
    } catch (err) {
      drawer.innerHTML = `<div style="color: var(--danger); font-size: 0.8rem; padding: 6px;">Error: ${err.message}</div>`;
    }
  }

  function renderFilesDrawer(repoName, branch, files) {
    const drawer = document.getElementById(`drawer-${repoName}`);
    if (!files || files.length === 0) {
      drawer.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 6px;">No files found in branch.</div>';
      return;
    }

    let html = '';
    files.forEach(f => {
      const blobUrl = `https://github.com/${currentUser}/${repoName}/blob/${branch}/${f.path}`;
      html += `
        <div class="file-item">
          <a href="${blobUrl}" target="_blank" class="file-path">${f.path}</a>
          <a href="${f.raw_url}" target="_blank" download class="file-download-link">Download</a>
        </div>
      `;
    });
    drawer.innerHTML = html;
  }

  function handleFilter(term) {
    currentFilter = term.toLowerCase().trim();
    renderRepos();
  }

  function getSortedRepos(repos, sortMode, prefs, visits) {
    const favRepos = [];
    const unfavRepos = [];

    repos.forEach(r => {
      if (prefs.favorites.includes(r.name)) {
        favRepos.push(r);
      } else {
        unfavRepos.push(r);
      }
    });

    favRepos.sort((a, b) => {
      const idxA = prefs.favorites.indexOf(a.name);
      const idxB = prefs.favorites.indexOf(b.name);
      return idxA - idxB;
    });

    unfavRepos.sort((a, b) => {
      if (sortMode === 'visited') {
        const aVisit = visits[a.name] || 0;
        const bVisit = visits[b.name] || 0;
        return bVisit - aVisit;
      } else if (sortMode === 'alpha') {
        return a.name.localeCompare(b.name);
      } else {
        return 0;
      }
    });

    return [...favRepos, ...unfavRepos];
  }

  let activeDragCard = null;

  function handleDragStart(e) {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const card = handle.closest('.repo-card');
    if (!card) return;

    e.preventDefault();
    activeDragCard = card;
    card.classList.add('is-dragging');

    const onPointerMove = (ev) => {
      if (!activeDragCard) return;
      const allFavCards = [...document.querySelectorAll('.repo-card[data-fav="true"]')].filter(c => c !== activeDragCard);
      for (const overCard of allFavCards) {
        const rect = overCard.getBoundingClientRect();
        if (ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
          const midY = rect.top + rect.height / 2;
          const parent = overCard.parentNode;
          if (ev.clientY < midY) {
            parent.insertBefore(activeDragCard, overCard);
          } else {
            parent.insertBefore(activeDragCard, overCard.nextSibling);
          }
          break;
        }
      }
    };

    const onPointerUp = (ev) => {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);

      if (!activeDragCard) return;
      activeDragCard.classList.remove('is-dragging');
      activeDragCard = null;

      const prefs = getPrefs();
      const reorderedSubset = [...document.querySelectorAll('.repo-card[data-fav="true"]')].map(el => el.dataset.repo);
      const remaining = prefs.favorites.filter(name => !reorderedSubset.includes(name));
      prefs.favorites = [...reorderedSubset, ...remaining];
      savePrefs(prefs);
      renderRepos();
    };

    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function renderRepos() {
    const container = document.getElementById('repo-list');
    const prefs = getPrefs();
    const visits = getVisits();

    const sortSelect = document.getElementById('sort-select');
    if (sortSelect && sortSelect.value !== prefs.sort) {
      sortSelect.value = prefs.sort;
    }

    const term = currentFilter;
    const searchFiltered = reposData.filter(r => r.name.toLowerCase().includes(term));
    const hiddenCount = searchFiltered.filter(r => prefs.hidden.includes(r.name)).length;
    const visibleRepos = searchFiltered.filter(r => !prefs.hidden.includes(r.name));

    const sorted = getSortedRepos(visibleRepos, prefs.sort, prefs, visits);

    if (sorted.length === 0 && hiddenCount === 0) {
      container.innerHTML = '<div class="empty-state">No repositories match your criteria.</div>';
      renderHiddenBar(0);
      return;
    }

    if (sorted.length === 0 && hiddenCount > 0) {
      container.innerHTML = '<div class="empty-state">All matching repositories are hidden.</div>';
      renderHiddenBar(hiddenCount);
      return;
    }

    let html = '';
    sorted.forEach(repo => {
      const isFav = prefs.favorites.includes(repo.name);
      const isUserPage = repo.name.toLowerCase() === `${currentUser.toLowerCase()}.github.io`;
      const pagesUrl = isUserPage ? `https://${currentUser}.github.io/` : `https://${currentUser}.github.io/${repo.name}/`;

      html += `
        <div class="repo-card" data-repo="${repo.name}" data-fav="${isFav}">
          <div class="repo-row-top">
            <div class="repo-id-group">
              <a href="${pagesUrl}" target="_blank" class="btn btn-blue btn-primary-goto" onclick="recordVisit('${repo.name}')">Go to ${repo.name}</a>
              <a href="${repo.repo_url}" target="_blank" class="repo-text-link">Repo ↗</a>
            </div>
            <div class="repo-tools">
              <button class="tool-btn ${isFav ? 'star-active' : ''}" onclick="toggleFavorite('${repo.name}')" title="Favorite repository">${isFav ? '★' : '☆'}</button>
              <button class="tool-btn" onclick="toggleHide('${repo.name}')" title="Hide repository">✕</button>
              ${isFav ? `<span class="drag-handle" onpointerdown="handleDragStart(event)" title="Drag to reorder">⋮⋮</span>` : ''}
            </div>
          </div>
          <div class="repo-row-bottom">
            <button id="toggle-btn-${repo.name}" class="files-toggle-btn" onclick="loadRepoFiles('${repo.name}', '${repo.branch}')">
              Files ▼
            </button>
            <div class="repo-quick-actions">
              <a href="${repo.upload_url}" target="_blank" class="btn btn-green btn-sm">↑ Upload</a>
              <a href="${repo.zip_url}" target="_blank" class="btn btn-blue btn-sm" download>↓ ZIP</a>
            </div>
          </div>
          <div id="drawer-${repo.name}" class="files-drawer"></div>
        </div>
      `;
    });

    container.innerHTML = html;
    renderHiddenBar(hiddenCount);
  }

  function renderHiddenBar(count) {
    const bar = document.getElementById('hidden-bar');
    if (!bar) return;
    if (count > 0) {
      bar.innerHTML = `<span>${count} ${count === 1 ? 'repository' : 'repositories'} hidden</span><button onclick="unhideAll()">Unhide all</button>`;
      bar.style.display = 'flex';
    } else {
      bar.style.display = 'none';
    }
  }

  // Restore cached quota on boot
  loadCachedQuota();

  // Periodic relative time ticker
  relativeTimeTimer = setInterval(updateStatusUI, 30000);

  // Global hotkey: '/' focuses filter input
  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== document.getElementById('filter-input') && !document.activeElement.matches('input, textarea')) {
      e.preventDefault();
      const fi = document.getElementById('filter-input');
      if (fi) fi.focus();
    }
  });

  // Initialize
  loadInitialData();
</script>
</body>
</html>
